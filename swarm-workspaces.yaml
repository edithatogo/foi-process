    swarm_config: hathi-nz/swarm-config.yaml
    subagents: hathi-nz/subagents.yaml
    task_plan: hathi-nz/task_plan.md
    notes: Local swarm files exist; root swarm can also dispatch from here.
  - id: nlp-policy-nz
    path: nlp-policy-nz
    conductor: nlp-policy-nz/conductor/tracks.md
