# Root Antigravity swarm workspace inventory.
#
# This file is the control-plane list for running Conductor work from the
# legal-nz root. Subprojects may also have their own swarm files, but the root
# swarm can dispatch against every workspace listed here.

version: 1
root: .
default_preset: all_conductor

workspaces:
  - id: legal-nz
    path: .
    conductor: conductor/tracks.md
    swarm_config: swarm-config.yaml
    subagents: subagents.yaml
    task_plan: task_plan.md
    notes: Root workspace. Tracks 1-9 complete; Track 10 local work exhausted, remaining items gated.
  - id: cli-legislation-nz
    path: cli-legislation-nz
    conductor: cli-legislation-nz/conductor/tracks.md
    swarm_config: inherited:root
    subagents: inherited:root
    task_plan: generated:root
    notes: No local swarm files found; root swarm controls this workspace.
  - id: corpus-cases-medilegal-nz
    path: corpus-cases-medilegal-nz
    conductor: corpus-cases-medilegal-nz/conductor/tracks.md
    swarm_config: corpus-cases-medilegal-nz/swarm-config.yaml
    subagents: corpus-cases-medilegal-nz/subagents.yaml
    task_plan: corpus-cases-medilegal-nz/task_plan.md
    notes: Local swarm files exist; root swarm can also dispatch from here.
  - id: corpus-law-nz
    path: corpus-law-nz
