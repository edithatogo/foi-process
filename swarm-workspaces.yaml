  - id: fyi-cli
    path: fyi-cli
    conductor: fyi-cli/.conductor/tracks.md
    swarm_config: inherited:root
    subagents: inherited:root
    task_plan: generated:root
    notes: Auxiliary CLI repo mapped on 2026-06-15; exact role, submodule promotion, and CLI entrypoint audit pending.
  - id: dnz
    path: dnz
    conductor: dnz/conductor/tracks.md
    swarm_config: inherited:root
    subagents: dnz/subagents.yaml
    task_plan: generated:root
    notes: Promoted on 2026-06-15 as DigitalNZ Rust integration hub at https://github.com/edithatogo/dnz; root swarm can dispatch from here.
  - id: friction
    path: Friction
