gates:
  local:
    - file edits
    - local tests
    - local parsing
    - documentation updates
    - non-authenticated inspection
  chrome:
    - browser profile access
    - OAuth
    - authenticated web consoles
    - screenshots
  external_write:
    - git commit
    - git push
    - uploads
    - Hugging Face mutation
    - Zenodo mutation
    - OSF mutation
    - social platform posting
    - account setting changes
    - .env creation or synchronization
