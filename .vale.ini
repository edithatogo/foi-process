# Root Vale Linter Configuration — NZ Legislation Workspace
#
# This file provides the global baseline for all subprojects.
# Subproject .vale.ini files may extend or override specific sections.
#
# StylesPath: relative to this file's directory
StylesPath = .github/styles
MinAlertLevel = suggestion

# Shared NZ Legal Vocabulary (see .github/styles/Vocab/NZLegal/accept.txt)
Vocab = NZLegal

# Global prose quality packages
Packages = write-good, Microsoft

# ── Default rules for all Markdown files across all projects ──────────────
[*.md]
BasedOnStyles = Vale, write-good, Microsoft
# Disable Microsoft's HeadingPunctuation for markdown (headings with colons are valid)
Microsoft.HeadingPunctuation = NO
# Disable write-good E-Prime for technical/legal writing
write-good.E-Prime = NO

# ── Relaxed rules for specific paths ──────────────────────────────────────

# CHANGELOG files — only baseline Vale checks
[CHANGELOG.md]
BasedOnStyles = Vale

# API docs — only baseline Vale checks
[docs/api/**]
BasedOnStyles = Vale

# Generated/conductor docs — skip elaborate prose checks
[conductor/**]
BasedOnStyles = Vale
