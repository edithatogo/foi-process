name: Live fyi-archive manifest acceptance

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      manifest_url:
        description: Pinned public fyi-archive manifest URL
        required: true
        default: https://huggingface.co/datasets/edithatogo/fyi-archive-nz/resolve/bd119937c0532cc1f03ca60a7d84ca6991dab5c6/manifests/latest_manifest.json
        type: string
      source_revision:
        description: Immutable Hugging Face source revision present in manifest_url
        required: true
        default: bd119937c0532cc1f03ca60a7d84ca6991dab5c6
        type: string
      manifest_sha256:
        description: Expected SHA-256 of the pinned manifest
        required: true
        default: 23cab9ee0ac6986326d67c91a91e415456a1d0589c90ec1c1628556e0d0d6e1e
        type: string
      takedown_revision:
        description: Approved fyi-archive takedown input revision
        required: false
        type: string
      benchmark_only:
        description: Run non-publishing T08 profile without claiming production continuation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    env:
      MANIFEST_URL: ${{ inputs.manifest_url || 'https://huggingface.co/datasets/edithatogo/fyi-archive-nz/resolve/bd119937c0532cc1f03ca60a7d84ca6991dab5c6/manifests/latest_manifest.json' }}
      SOURCE_REVISION: ${{ inputs.source_revision || 'bd119937c0532cc1f03ca60a7d84ca6991dab5c6' }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 || '23cab9ee0ac6986326d67c91a91e415456a1d0589c90ec1c1628556e0d0d6e1e' }}
      TAKEDOWN_REVISION: ${{ inputs.takedown_revision || vars.FYI_TAKEDOWN_REVISION }}
      BENCHMARK_ONLY: ${{ inputs.benchmark_only || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - name: Enforce governance and operational inputs
        id: gate
        run: |
          set -euo pipefail
          python scripts/validate_governance_gate.py
          if [[ "$BENCHMARK_ONLY" == "true" ]]; then
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || { echo "benchmark_only requires workflow_dispatch"; exit 1; }
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${TAKEDOWN_REVISION:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo "::notice::Recurring acceptance skipped: FYI_TAKEDOWN_REVISION is not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "FYI_TAKEDOWN_REVISION variable or takedown_revision input is required"
            exit 1
          fi
      - name: Download pinned manifest
        if: steps.gate.outputs.enabled == 'true'
        env:
          MANIFEST_URL: ${{ env.MANIFEST_URL }}
        run: |
          set -euo pipefail
          mkdir -p target/live-archive-acceptance
          python - <<'PY'
          import os
          import re

          revision = os.environ["SOURCE_REVISION"]
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit("source_revision must be a 40-character lowercase Git revision")
          if f"/resolve/{revision}/" not in os.environ["MANIFEST_URL"]:
              raise SystemExit("manifest_url does not contain the declared immutable source_revision")
          PY
          python scripts/download_allowlisted.py \
            "$MANIFEST_URL" \
            target/live-archive-acceptance/manifest.json \
            --expected-sha256 "$MANIFEST_SHA256" \
            --connect-timeout 30 \
            --overall-timeout 180 \
            --max-bytes 25000000
      - name: Convert and verify manifest coverage
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          manifest=target/live-archive-acceptance/manifest.json
          deltas=target/live-archive-acceptance/evidence-deltas.ndjson
          repeat=target/live-archive-acceptance/evidence-deltas-repeat.ndjson
          captured_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          /usr/bin/time -f '%e %M' -o target/live-archive-acceptance/adapter.time \
            cargo run --locked --release --bin foi-process -- \
            fyi-archive-manifest-to-deltas "$manifest" "$deltas" \
            --captured-at "$captured_at"
          cargo run --locked --release --bin foi-process -- \
            fyi-archive-manifest-to-deltas "$manifest" "$repeat" \
            --captured-at "$captured_at"
          python scripts/run_rust_scale_suite.py --profiles 1000 --repetitions 3 --output target/live-archive-acceptance/benchmark.json
          python scripts/validate_scale_report.py target/live-archive-acceptance/benchmark.json
          python - <<'PY'
          from pathlib import Path

          rows = Path("target/live-archive-acceptance/evidence-deltas.ndjson").read_text(encoding="utf-8").splitlines()
          midpoint = len(rows) // 2
          root = Path("target/live-archive-acceptance")
          (root / "deltas-first.ndjson").write_text("\n".join(rows[:midpoint]) + "\n", encoding="utf-8")
          (root / "deltas-second.ndjson").write_text("\n".join(rows[midpoint:]) + "\n", encoding="utf-8")
          if midpoint < 1 or midpoint >= len(rows):
              raise SystemExit("delta stream is too small for continuation split")
          PY
          processed_at="2026-07-21T00:00:00Z"
          /usr/bin/time -f '%e %M' -o target/live-archive-acceptance/full-replay.time \
            cargo run --locked --release --bin foi-process -- \
            replay-stream "$deltas" target/live-archive-acceptance/full \
            --processed-at "$processed_at" \
            --state-out target/live-archive-acceptance/full-snapshot.json
          /usr/bin/time -f '%e %M' -o target/live-archive-acceptance/incremental-first.time \
            cargo run --locked --release --bin foi-process -- \
            replay-stream target/live-archive-acceptance/deltas-first.ndjson target/live-archive-acceptance/incremental-first \
            --processed-at "$processed_at" \
            --state-out target/live-archive-acceptance/incremental-first-snapshot.json
          /usr/bin/time -f '%e %M' -o target/live-archive-acceptance/incremental-second.time \
            cargo run --locked --release --bin foi-process -- \
            replay-stream target/live-archive-acceptance/deltas-second.ndjson target/live-archive-acceptance/incremental-second \
            --processed-at "$processed_at" \
            --state-in target/live-archive-acceptance/incremental-first-snapshot.json \
            --state-out target/live-archive-acceptance/incremental-final-snapshot.json
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("target/live-archive-acceptance")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          rows = [
              json.loads(line)
              for line in (root / "evidence-deltas.ndjson").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          declared = int(manifest["meta"]["record_count"])
          if declared != len(manifest.get("requests", [])):
              raise SystemExit("manifest record_count does not match request rows")
          if declared != len(rows):
              raise SystemExit("adapter output count does not match manifest record_count")
          first = hashlib.sha256((root / "evidence-deltas.ndjson").read_bytes()).hexdigest()
          second = hashlib.sha256((root / "evidence-deltas-repeat.ndjson").read_bytes()).hexdigest()
          if first != second:
              raise SystemExit("adapter output hash was not stable")
          def canonical_hash(path: Path) -> str:
              value = json.loads(path.read_text(encoding="utf-8"))
              canonical = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
              return hashlib.sha256(canonical).hexdigest()

          full_hash = canonical_hash(root / "full-snapshot.json")
          incremental_hash = canonical_hash(root / "incremental-final-snapshot.json")
          if full_hash != incremental_hash:
              raise SystemExit("full replay and incremental continuation snapshots differ")
          def timing(name: str) -> dict[str, float | int]:
              elapsed, resident_kib = (root / name).read_text(encoding="ascii").split()
              return {"elapsed_seconds": float(elapsed), "peak_resident_bytes": int(resident_kib) * 1024}

          evidence = {
              "schema": "foi-process/live-archive-manifest-profile/v2",
              "source_url": os.environ["MANIFEST_URL"],
              "source_revision": os.environ["SOURCE_REVISION"],
              "manifest_sha256": hashlib.sha256((root / "manifest.json").read_bytes()).hexdigest(),
              "event_delta_sha256": first,
              "record_count": declared,
              "full_replay_snapshot_sha256": full_hash,
              "incremental_replay_snapshot_sha256": incremental_hash,
              "replay_continuation_equal": True,
              "adapter": "foi-process fyi-archive-manifest-to-deltas",
              "operation": "benchmark_only_nonpublication" if os.environ["BENCHMARK_ONLY"] == "true" else "recurring_evidence_only",
              "takedown_revision": os.environ.get("TAKEDOWN_REVISION") or None,
              "benchmark_sha256": hashlib.sha256((root / "benchmark.json").read_bytes()).hexdigest(),
              "live_profile": {
                  "adapter": timing("adapter.time"),
                  "full_replay": timing("full-replay.time"),
                  "incremental_first": timing("incremental-first.time"),
                  "incremental_second": timing("incremental-second.time"),
              },
              "raw_content_retained": False,
              "publication_performed": False,
          }
          (root / "acceptance-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (root / "manifest.json").unlink()
          (root / "evidence-deltas.ndjson").unlink()
          (root / "evidence-deltas-repeat.ndjson").unlink()
          (root / "deltas-first.ndjson").unlink()
          (root / "deltas-second.ndjson").unlink()
          for path in (root / "full", root / "incremental-first", root / "incremental-second"):
              import shutil
              shutil.rmtree(path)
          (root / "full-snapshot.json").unlink()
          (root / "incremental-first-snapshot.json").unlink()
          (root / "incremental-final-snapshot.json").unlink()
          for path in root.glob("*.time"):
              path.unlink()
          PY
      - name: Upload redacted acceptance evidence
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-archive-manifest-acceptance
          path: |
            target/live-archive-acceptance/acceptance-evidence.json
            target/live-archive-acceptance/benchmark.json
          retention-days: 30
