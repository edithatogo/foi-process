name: publish-hf-dataset

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: Hugging Face dataset repository
        required: true
        default: edithatogo/foi-process-event-logs
      publish:
        description: Upload the validated bundle to Hugging Face
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Enforce synthetic-only publication gate
        run: python scripts/validate_governance_gate.py
      - name: Build public-safe fixture dataset
        run: python scripts/build_hf_dataset.py --output /tmp/foi-process-event-logs
      - name: Verify manifest and JSON Lines
        run: python scripts/verify_hf_publication.py local --bundle /tmp/foi-process-event-logs
      - uses: actions/upload-artifact@v4
        with:
          name: foi-process-event-logs
          path: /tmp/foi-process-event-logs
      - name: Install Hugging Face CLI
        if: ${{ inputs.publish }}
        run: python -m pip install --upgrade huggingface_hub
      - name: Enforce approved Hugging Face destination
        if: ${{ inputs.publish }}
        env:
          REPO_ID: ${{ inputs.repo_id }}
        run: |
          test "$REPO_ID" = "edithatogo/foi-process-event-logs" || {
            echo "Refusing unapproved Hugging Face dataset destination: $REPO_ID";
            exit 1;
          }
      - name: Publish dataset
        if: ${{ inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO_ID: ${{ inputs.repo_id }}
        run: |
          test -n "${HF_TOKEN:-}" || { echo 'HF_TOKEN secret is required'; exit 1; }
          hf repo create "$REPO_ID" --repo-type dataset --exist-ok
          hf upload "$REPO_ID" /tmp/foi-process-event-logs . --repo-type dataset \
            --commit-message "Publish reviewed foi-process fixture event logs"
      - name: Verify published dataset revision
        if: ${{ inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO_ID: ${{ inputs.repo_id }}
        run: |
          python scripts/verify_hf_publication.py dataset \
            --repo-id "$REPO_ID" \
            --bundle /tmp/foi-process-event-logs \
            --output /tmp/hf-dataset-publication-attestation.json
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.publish }}
        with:
          name: hf-dataset-publication-attestation
          path: /tmp/hf-dataset-publication-attestation.json
