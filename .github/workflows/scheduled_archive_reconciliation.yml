name: scheduled archive package reconciliation

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      instance_id:
        description: Exact archive instance identifier
        required: true
        type: string
      source_mode:
        description: Use the checked-in fixture or an immutable package ZIP
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - immutable_zip
      package_url:
        description: HTTPS URL for the immutable package ZIP
        required: false
        type: string
      package_sha256:
        description: SHA-256 of the immutable package ZIP
        required: false
        type: string
      policy_url:
        description: HTTPS URL for the revision-pinned intake policy JSON
        required: false
        type: string
      policy_sha256:
        description: SHA-256 of the intake policy JSON
        required: false
        type: string
      bootstrap:
        description: Permit creation of first state for this instance
        required: true
        default: false
        type: boolean
      dry_run:
        description: Validate and reconcile without saving cross-run state
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: archive-reconciliation-${{ inputs.instance_id || 'nz-fyi-fixture' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INSTANCE_ID: ${{ inputs.instance_id || 'nz-fyi-fixture' }}
      SOURCE_MODE: ${{ inputs.source_mode || 'fixture' }}
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
      BOOTSTRAP_REQUESTED: ${{ inputs.bootstrap == true && 'true' || (github.event_name == 'schedule' && 'true' || 'false') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88.0"
      - name: Initialize failure evidence
        run: |
          mkdir -p target/reconciliation-evidence
          jq -n \
            --arg schema_version "1.0.0" \
            --arg instance_id "$INSTANCE_ID" \
            --arg source_mode "$SOURCE_MODE" \
            --argjson dry_run "$DRY_RUN" \
            '{schema_version:$schema_version,instance_id:$instance_id,package_id:null,source_mode:$source_mode,dry_run:$dry_run,classification:"failed",exit_code:null}' \
            >target/reconciliation-evidence/run-status.json
      - name: Validate explicit instance and prepare package
        id: package
        env:
          PACKAGE_URL: ${{ inputs.package_url }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          POLICY_URL: ${{ inputs.policy_url }}
          POLICY_SHA256: ${{ inputs.policy_sha256 }}
        run: |
          set -euo pipefail
          [[ "$INSTANCE_ID" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]] || {
            echo "invalid instance_id: $INSTANCE_ID" >&2
            exit 2
          }
          mkdir -p target/reconciliation-input
          if [[ "$SOURCE_MODE" == fixture ]]; then
            test "$INSTANCE_ID" = nz-fyi-fixture || {
              echo "fixture mode requires instance_id=nz-fyi-fixture" >&2
              exit 2
            }
            package_root=examples/archive-package/nz-fyi-fixture
            policy_path=examples/archive-package/nz-fyi-fixture-policy.json
          elif [[ "$SOURCE_MODE" == immutable_zip ]]; then
            [[ "$PACKAGE_URL" == https://* && "$POLICY_URL" == https://* ]] || {
              echo "immutable_zip requires HTTPS package_url and policy_url" >&2
              exit 2
            }
            [[ "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ && "$POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
              echo "immutable_zip requires lowercase SHA-256 pins" >&2
              exit 2
            }
            python scripts/download_allowlisted.py \
              "$PACKAGE_URL" target/reconciliation-input/package.zip \
              --expected-sha256 "$PACKAGE_SHA256" \
              --connect-timeout 10 --overall-timeout 120 --max-bytes 536870912
            python scripts/download_allowlisted.py \
              "$POLICY_URL" target/reconciliation-input/policy.json \
              --expected-sha256 "$POLICY_SHA256" \
              --connect-timeout 10 --overall-timeout 30 --max-bytes 1048576
            python scripts/safe_extract_archive_package.py \
              target/reconciliation-input/package.zip \
              target/reconciliation-input/package
            package_root=target/reconciliation-input/package
            policy_path=target/reconciliation-input/policy.json
          else
            echo "unsupported source_mode: $SOURCE_MODE" >&2
            exit 2
          fi
          python - "$package_root/archive-package.json" "$policy_path" "$INSTANCE_ID" >>"$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          policy = json.load(open(sys.argv[2], encoding="utf-8"))
          instance = sys.argv[3]
          package_id = manifest.get("package_id", "")
          if manifest.get("instance_id") != instance or policy.get("expected_instance_id") != instance:
              raise SystemExit("manifest/policy instance does not match explicit instance_id")
          if not re.fullmatch(r"[0-9a-f]{64}", package_id):
              raise SystemExit("manifest package_id is not a lowercase SHA-256")
          print(f"package_root={sys.argv[1].rsplit('/', 1)[0]}")
          print(f"policy_path={sys.argv[2]}")
          print(f"package_id={package_id}")
          PY
      - name: Restore latest state for this instance
        id: state-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/instance-reconciliation/${{ env.INSTANCE_ID }}
          key: archive-reconciliation-${{ env.INSTANCE_ID }}-${{ steps.package.outputs.package_id }}
          restore-keys: |
            archive-reconciliation-${{ env.INSTANCE_ID }}-
      - name: Reconcile exactly one immutable package
        id: reconcile
        env:
          PACKAGE_ROOT: ${{ steps.package.outputs.package_root }}
          POLICY_PATH: ${{ steps.package.outputs.policy_path }}
        run: |
          set +e
          state_root="target/instance-reconciliation/$INSTANCE_ID"
          mkdir -p target/reconciliation-evidence
          bootstrap=()
          if [[ ! -d "$state_root/generations" && ( "$BOOTSTRAP_REQUESTED" == true || "$SOURCE_MODE" == fixture ) ]]; then
            bootstrap=(--bootstrap)
          fi
          cargo run --locked --release --bin foi-process -- \
            reconcile-archive-package "$PACKAGE_ROOT" "$state_root" \
            --policy "$POLICY_PATH" "${bootstrap[@]}" \
            >target/reconciliation-evidence/outcome.json \
            2>target/reconciliation-evidence/stderr.txt
          exit_code=$?
          if [[ $exit_code -eq 0 ]]; then
            case "$(jq -r .status target/reconciliation-evidence/outcome.json)" in
              applied) classification=accepted ;;
              no_op) classification=no_change ;;
              *) classification=failed ;;
            esac
          elif grep -Eqi 'revision (regressed|gap|conflicting)|failed validation|mismatch|unsupported|bootstrap' \
            target/reconciliation-evidence/stderr.txt; then
            classification=quarantined
          else
            classification=failed
          fi
          jq -n \
            --arg schema_version "1.0.0" \
            --arg instance_id "$INSTANCE_ID" \
            --arg package_id "${{ steps.package.outputs.package_id }}" \
            --arg source_mode "$SOURCE_MODE" \
            --argjson dry_run "$DRY_RUN" \
            --arg classification "$classification" \
            --argjson exit_code "$exit_code" \
            '{schema_version:$schema_version,instance_id:$instance_id,package_id:$package_id,source_mode:$source_mode,dry_run:$dry_run,classification:$classification,exit_code:$exit_code}' \
            >target/reconciliation-evidence/run-status.json
          echo "exit_code=$exit_code" >>"$GITHUB_OUTPUT"
          echo "classification=$classification" >>"$GITHUB_OUTPUT"
          exit 0
      - name: Collect deterministic state receipt
        if: ${{ steps.reconcile.outputs.exit_code == '0' }}
        run: |
          set -euo pipefail
          state_path=$(jq -r .state_path target/reconciliation-evidence/outcome.json)
          receipt_path=$(jq -r .receipt_path target/reconciliation-evidence/outcome.json)
          cp "$state_path" target/reconciliation-evidence/state.json
          cp "$receipt_path" target/reconciliation-evidence/receipt.json
          sha256sum target/reconciliation-evidence/{outcome,receipt,state}.json \
            >target/reconciliation-evidence/SHA256SUMS
      - name: Save accepted per-instance state
        if: ${{ steps.reconcile.outputs.exit_code == '0' && env.DRY_RUN != 'true' && steps.state-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/instance-reconciliation/${{ env.INSTANCE_ID }}
          key: archive-reconciliation-${{ env.INSTANCE_ID }}-${{ steps.package.outputs.package_id }}
      - name: Upload bounded reconciliation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-reconciliation-${{ env.INSTANCE_ID }}-${{ github.run_id }}
          path: target/reconciliation-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Fail after preserving evidence
        if: ${{ steps.reconcile.outputs.exit_code != '0' }}
        run: |
          cat target/reconciliation-evidence/stderr.txt >&2
          exit "${{ steps.reconcile.outputs.exit_code }}"
