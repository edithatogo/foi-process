name: deploy-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "space/**"
      - "scripts/build_hf_dataset.py"
      - "scripts/build_hf_space_data.py"
      - "scripts/check_hf_space_budget.py"
      - ".github/workflows/deploy_pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Enforce synthetic-only publication gate
        run: python scripts/validate_governance_gate.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: space/package-lock.json
      - name: Build verified dashboard projection
        run: |
          python scripts/build_hf_dataset.py --output /tmp/foi-process-event-logs
          python scripts/build_hf_space_data.py \
            --bundle /tmp/foi-process-event-logs \
            --output space/public/data/dashboard-data.json
      - name: Build dashboard
        working-directory: space
        run: |
          npm ci
          npm run build
      - name: Enforce dashboard budget
        run: python scripts/check_hf_space_budget.py --dist space/dist --dashboard-data space/public/data/dashboard-data.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: space/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
