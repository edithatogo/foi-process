name: preserve release in Zenodo

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to preserve
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preserve release archive and record DOI evidence
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test -n "$ZENODO_TOKEN" || { echo "ZENODO_TOKEN is required" >&2; exit 1; }
          python3 scripts/preserve_zenodo_release.py \
            --token "$ZENODO_TOKEN" \
            --release-tag "$RELEASE_TAG" \
            --output zenodo-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenodo-preservation-evidence
          path: zenodo-evidence.json
