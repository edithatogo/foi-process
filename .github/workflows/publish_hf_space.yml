name: publish-hf-space

on:
  workflow_dispatch:
    inputs:
      space_id:
        description: Hugging Face Space repository
        required: true
        default: edithatogo/foi-process-explorer-free
      publish:
        description: Upload the validated pre-built Static Space to Hugging Face
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: space/package-lock.json
      - name: Enforce synthetic-only publication gate
        run: python scripts/validate_governance_gate.py
      - name: Build public-safe fixture dataset
        run: python scripts/build_hf_dataset.py --output /tmp/foi-process-event-logs
      - name: Build verified dashboard projection
        run: |
          python scripts/build_hf_space_data.py \
            --bundle /tmp/foi-process-event-logs \
            --output space/public/data/dashboard-data.json
      - name: Build dashboard assets
        working-directory: space
        run: |
          npm ci
          npm run build
      - name: Enforce dashboard asset budget
        run: python scripts/check_hf_space_budget.py --dist space/dist --dashboard-data space/public/data/dashboard-data.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foi-process-explorer-space
          path: |
            space/dist
            space/public/data/dashboard-data.json
      - name: Install Hugging Face CLI
        if: ${{ inputs.publish }}
        run: |
          python -m pip install --disable-pip-version-check click==8.2.1
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-hf-publish.txt
      - name: Enforce approved Hugging Face destination
        if: ${{ inputs.publish }}
        env:
          SPACE_ID: ${{ inputs.space_id }}
        run: |
          case "$SPACE_ID" in
            edithatogo/foi-process-explorer-free) ;;
            *)
            echo "Refusing unapproved Hugging Face Space destination: $SPACE_ID";
            exit 1;
            ;;
          esac
      - name: Publish pre-built Static Space
        if: ${{ inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ inputs.space_id }}
        run: |
          test -n "${HF_TOKEN:-}" || { echo 'HF_TOKEN secret is required'; exit 1; }
          python - <<'PY'
          import os
          import shutil
          import tempfile
          from pathlib import Path

          from huggingface_hub import HfApi

          with tempfile.TemporaryDirectory(prefix="foi-process-space-publish-") as temp:
              publish = Path(temp)
              shutil.copy2("space/README.md", publish / "README.md")
              shutil.copytree("space/dist", publish, dirs_exist_ok=True)
              HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
                  repo_id=os.environ["SPACE_ID"],
                  repo_type="space",
                  folder_path=publish,
                  path_in_repo=".",
                  delete_patterns=["*"],
                  commit_message="Publish verified FOI process explorer",
              )
          PY
      - name: Verify published Space revision and runtime
        if: ${{ inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ inputs.space_id }}
        run: |
          python scripts/verify_hf_publication.py space \
            --repo-id "$SPACE_ID" \
            --source space \
            --output /tmp/hf-space-publication-attestation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.publish }}
        with:
          name: hf-space-publication-attestation
          path: /tmp/hf-space-publication-attestation.json
