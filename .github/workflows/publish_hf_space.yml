name: publish-hf-space

on:
  workflow_dispatch:
    inputs:
      space_id:
        description: Hugging Face Space repository
        required: true
        default: edithatogo/foi-process-explorer
      publish:
        description: Upload the validated free CPU Docker Space to Hugging Face
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Enforce synthetic-only publication gate
        run: python scripts/validate_governance_gate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: space/package-lock.json
      - name: Build public-safe fixture dataset
        run: python scripts/build_hf_dataset.py --output /tmp/foi-process-event-logs
      - name: Build verified dashboard projection
        run: |
          python scripts/build_hf_space_data.py \
            --bundle /tmp/foi-process-event-logs \
            --output space/public/data/dashboard-data.json
      - name: Build dashboard assets for Docker Space
        working-directory: space
        run: |
          npm ci
          npm run build
      - name: Enforce Space asset budget
        run: python scripts/check_hf_space_budget.py --dist space/dist --dashboard-data space/public/data/dashboard-data.json
      - uses: actions/upload-artifact@v4
        with:
          name: foi-process-explorer-space
          path: |
            space/dist
            space/public/data/dashboard-data.json
      - name: Install Hugging Face CLI
        if: ${{ inputs.publish }}
        run: python -m pip install --upgrade huggingface_hub
      - name: Publish Docker Space
        if: ${{ inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ inputs.space_id }}
        run: |
          test -n "${HF_TOKEN:-}" || { echo 'HF_TOKEN secret is required'; exit 1; }
          hf repo create "$SPACE_ID" --repo-type space --space-sdk docker --exist-ok
          python - <<'PY'
          import os
          import shutil
          import tempfile
          from pathlib import Path

          from huggingface_hub import HfApi

          with tempfile.TemporaryDirectory(prefix="foi-process-space-publish-") as temp:
              publish = Path(temp)
              shutil.copytree("space", publish, dirs_exist_ok=True, ignore=shutil.ignore_patterns("node_modules"))
              shutil.copytree("space/dist", publish, dirs_exist_ok=True)
              HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
                  repo_id=os.environ["SPACE_ID"],
                  repo_type="space",
                  folder_path=publish,
                  path_in_repo=".",
                  commit_message="Publish verified foi-process explorer",
              )
          PY
      - name: Verify published Space revision and runtime
        if: ${{ inputs.publish }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ inputs.space_id }}
        run: |
          python scripts/verify_hf_publication.py space \
            --repo-id "$SPACE_ID" \
            --source space \
            --output /tmp/hf-space-publication-attestation.json
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.publish }}
        with:
          name: hf-space-publication-attestation
          path: /tmp/hf-space-publication-attestation.json
