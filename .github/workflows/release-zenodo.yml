name: Release to Zenodo

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version tag (for example v0.1.0)"
        required: true
      corpus_dir:
        description: "Corpus data directory relative to repo root"
        required: true
        default: "corpus-law-nz"
      deposition_id:
        description: "Existing Zenodo deposition ID. Empty creates a new draft."
        required: false
        default: ""
      confirm_publish:
        description: "Set to true to upload and publish on Zenodo. Any other value validates/packages only."
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  package:
    name: Validate and package archive
    runs-on: ubuntu-latest
    outputs:
      archive_name: ${{ steps.archive.outputs.archive_name }}
      archive_sha256: ${{ steps.archive.outputs.archive_sha256 }}
      archive_size: ${{ steps.archive.outputs.archive_size }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate corpus directory
        env:
          CORPUS_DIR: ${{ inputs.corpus_dir }}
        run: |
          test -d "$CORPUS_DIR"
          test -d "$CORPUS_DIR/data"

      - name: Build archive
        id: archive
        env:
          CORPUS_DIR: ${{ inputs.corpus_dir }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive_name="corpus-legislation-nz-${VERSION}.zip"
          staging="$(mktemp -d)"
          cp -r "$CORPUS_DIR/data" "$staging/data"
          cp "$CORPUS_DIR/README.md" "$staging/" 2>/dev/null || true
          cp "$CORPUS_DIR/CITATION.cff" "$staging/" 2>/dev/null || true
          cp "$CORPUS_DIR/LICENSE" "$staging/" 2>/dev/null || true
          cp "$CORPUS_DIR/DATASET_CARD.md" "$staging/" 2>/dev/null || true
          cp -r "$CORPUS_DIR/schemas" "$staging/schemas" 2>/dev/null || true
          (cd "$staging" && zip -r "$GITHUB_WORKSPACE/dist/$archive_name" . -x '*/__pycache__/*' -x '*.pyc')
          archive_sha256="$(sha256sum "dist/$archive_name" | cut -d' ' -f1)"
          archive_size="$(stat -c%s "dist/$archive_name")"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "archive_size=$archive_size" >> "$GITHUB_OUTPUT"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: corpus-zenodo-archive
          path: dist/corpus-legislation-nz-*.zip

  publish:
    name: Publish to Zenodo
    needs: package
    if: ${{ inputs.confirm_publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download archive artifact
        uses: actions/download-artifact@v4
        with:
          name: corpus-zenodo-archive
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --upgrade requests

      - name: Upload and publish Zenodo deposition
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_API_URL: https://zenodo.org/api
          DEPOSITION_ID: ${{ inputs.deposition_id }}
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import requests

          token = os.environ.get('ZENODO_TOKEN')
          if not token:
              raise SystemExit('ZENODO_TOKEN secret is required when confirm_publish=true')
          api_url = os.environ['ZENODO_API_URL']
          deposition_id = os.environ.get('DEPOSITION_ID') or None
          version = os.environ['VERSION']
          archive = next(pathlib.Path('dist').glob('corpus-legislation-nz-*.zip'))
          session = requests.Session()
          headers = {'Authorization': f'Bearer {token}'}
          if deposition_id:
              response = session.get(f'{api_url}/deposit/depositions/{deposition_id}', headers=headers)
              response.raise_for_status()
              draft = response.json()
          else:
              response = session.post(f'{api_url}/deposit/depositions', headers=headers, json={})
              response.raise_for_status()
              draft = response.json()
          draft_id = draft['id']
          metadata = {
              'title': f'New Zealand Legislation Corpus {version}',
              'upload_type': 'dataset',
              'description': 'Snapshot of the New Zealand Legislation Corpus.',
              'creators': [{'name': 'edithatogo'}],
              'version': version,
              'license': 'other-open',
              'keywords': ['New Zealand', 'legislation', 'corpus', 'law', 'open data'],
          }
          response = session.put(f'{api_url}/deposit/depositions/{draft_id}', headers={**headers, 'Content-Type': 'application/json'}, data=json.dumps({'metadata': metadata}))
          response.raise_for_status()
          bucket_url = draft['links']['bucket']
          with archive.open('rb') as fh:
              response = session.put(f'{bucket_url}/{archive.name}', headers=headers, data=fh)
          response.raise_for_status()
          response = session.post(f'{api_url}/deposit/depositions/{draft_id}/actions/publish', headers=headers)
          response.raise_for_status()
          print(response.json().get('doi', 'published'))
          PY

      - name: Record registry submission feedback candidate
        if: failure()
        run: |
          python3 scripts/record_learning_candidate.py \
            --backlog conductor/improvement-backlog.md \
            --snapshot conductor/.tmp/registry-feedback-zenodo-${{ github.run_id }}.md \
            --message "Registry submission review feedback required for Zenodo publish (`${{ github.event.inputs.version }}`)" \
            --evidence "workflow=${{ github.workflow }}" \
            --evidence "run=${{ github.run_id }}" \
            --evidence "status=${{ job.status }}" \
            --evidence "deposition_id=${{ github.event.inputs.deposition_id }}"

      - name: Upload registry feedback snapshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registry-feedback-zenodo-${{ github.run_id }}
          path: conductor/.tmp/registry-feedback-zenodo-${{ github.run_id }}.md
