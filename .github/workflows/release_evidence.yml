name: release-evidence

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: Comma-separated benchmark case counts
        required: true
        default: 1000,10000,200000

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Run isolated Rust scale profiles
        run: |
          python scripts/run_rust_scale_suite.py \
            --profiles '${{ inputs.profiles }}' \
            --target-dir /tmp/foi-process-benchmark-target \
            --output /tmp/rust-scale-benchmark.json
      - name: Build release evidence
        run: |
          python scripts/validate_scale_report.py /tmp/rust-scale-benchmark.json
          python scripts/build_release_evidence.py \
            --benchmark /tmp/rust-scale-benchmark.json \
            --software-commit "$GITHUB_SHA" \
            --output /tmp/foi-process-release-evidence
      - name: Verify release evidence
        run: python scripts/verify_release_evidence.py /tmp/foi-process-release-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foi-process-release-evidence
          path: /tmp/foi-process-release-evidence
          if-no-files-found: error
