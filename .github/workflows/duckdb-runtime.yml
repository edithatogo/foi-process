name: DuckDB runtime evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Run DuckDB feature tests
        env:
          DUCKDB_DOWNLOAD_LIB: "1"
        run: cargo test --locked --all-targets --features ocel-duckdb
