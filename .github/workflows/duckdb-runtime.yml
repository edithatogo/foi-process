name: DuckDB runtime evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Install native DuckDB runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libduckdb-dev
      - name: Run DuckDB feature tests
        run: cargo test --locked --all-targets --features ocel-duckdb
