name: DuckDB runtime evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88.0"
      - name: Run DuckDB feature tests
        env:
          DUCKDB_DOWNLOAD_LIB: "1"
        run: cargo test --locked --all-targets --features ocel-duckdb
