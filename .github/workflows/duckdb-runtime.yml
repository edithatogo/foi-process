name: DuckDB runtime evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.88.0"
      - name: Run DuckDB feature tests
        env:
          DUCKDB_DOWNLOAD_LIB: "1"
        run: cargo test --locked --all-targets --features ocel-duckdb
