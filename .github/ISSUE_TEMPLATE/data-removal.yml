name: Data removal or correction request
description: Request removal or correction of non-sensitive published fixture metadata
title: "[Data request] "
labels:
  - data-governance
body:
  - type: markdown
    attributes:
      value: |
        Do not include personal information, confidential correspondence, or attachment contents.
        For an urgent privacy/security concern use the private Security Advisory channel in `docs/removal-appeal.md`.
  - type: input
    id: affected_url
    attributes:
      label: Affected public URL or path
    validations:
      required: true
  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      options:
        - Correction
        - Removal
        - Other publication concern
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Non-sensitive reason
      description: Describe the issue without reproducing personal or confidential data.
    validations:
      required: true
