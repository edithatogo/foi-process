[advisories]
yanked = "deny"
# These are transitive through the pinned process_mining 0.6.0 release and
# cannot be upgraded independently without changing that upstream contract.
# The optional adapter does not parse untrusted XML itself; track upstream
# process_mining for a quick-xml >= 0.41 release.
ignore = [
  "RUSTSEC-2024-0436",
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib"
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
