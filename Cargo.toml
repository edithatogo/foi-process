[package]
name = "foi-process"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/edithatogo/foi-process"
description = "Rust-first event spine, replay engine, and Rust4PM integration for FOI process intelligence"
publish = false

[features]
default = []
rust4pm = ["dep:process_mining"]
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]
ocel-sqlite = ["rust4pm", "process_mining/ocel-sqlite"]
ocel-duckdb = ["rust4pm", "process_mining/ocel-duckdb", "dep:duckdb"]
dataframes = ["rust4pm", "process_mining/dataframes"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4.40", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
schemars = { version = "1.1", features = ["chrono04"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "=0.3.2"
sha2 = "0.11"
hmac = "0.12"
thiserror = "2.0"
process_mining = { version = "=0.6.0", default-features = false, optional = true }
duckdb = { version = "=1.10501.0", default-features = false, optional = true }
arrow-array = { version = "=58.3.0", optional = true }
arrow-schema = { version = "=58.3.0", optional = true }
parquet = { version = "=58.3.0", default-features = false, features = ["arrow", "zstd"], optional = true }

[dev-dependencies]
proptest = "1.7"
tempfile = "3.20"

[[bin]]
name = "foi-process"
path = "src/main.rs"

[[bin]]
name = "schema-gen"
path = "src/bin/schema_gen.rs"

[[bin]]
name = "scale_bench"
path = "src/bin/scale_bench.rs"
