name: Contract change
about: Propose or promote a versioned contract
labels: [contract, promotion-gate]
body:
  - type: input
    id: contract
    attributes: {label: Contract and version}
    validations: {required: true}
  - type: input
    id: owner
    attributes: {label: Canonical owner}
    validations: {required: true}
  - type: textarea
    id: consumers
    attributes: {label: Named consumers and fixtures}
    validations: {required: true}
  - type: textarea
    id: compatibility
    attributes: {label: Compatibility and migration}
    validations: {required: true}
  - type: textarea
    id: safety
    attributes: {label: Privacy, legal, or human-review boundary}
