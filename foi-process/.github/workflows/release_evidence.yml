name: release-evidence

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: Comma-separated benchmark case counts
        required: true
        default: 1000,10000,200000

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Run isolated Rust scale profiles
        run: |
          python scripts/run_rust_scale_suite.py \
            --profiles '${{ inputs.profiles }}' \
            --target-dir /tmp/foi-process-benchmark-target \
            --output /tmp/rust-scale-benchmark.json
      - name: Build release evidence
        run: |
          python scripts/validate_scale_report.py /tmp/rust-scale-benchmark.json
          python scripts/build_release_evidence.py \
            --benchmark /tmp/rust-scale-benchmark.json \
            --software-commit "$GITHUB_SHA" \
            --output /tmp/foi-process-release-evidence
      - name: Verify release evidence
        run: python scripts/verify_release_evidence.py /tmp/foi-process-release-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foi-process-release-evidence
          path: /tmp/foi-process-release-evidence
          if-no-files-found: error
