name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-context:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate repository context and dependency policy
        shell: pwsh
        run: ./scripts/validate_repository_context.ps1

  rust:
    strategy:
      matrix:
        toolchain: ["1.88.0", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features rust4pm -- -D warnings
      - run: cargo test --locked --all-targets --features rust4pm
      - run: cargo doc --locked --no-deps --features rust4pm
      - run: cargo run --locked --bin schema-gen -- /tmp/generated-schemas
      - run: find /tmp/generated-schemas -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool >/dev/null

  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo check --locked --all-targets --all-features
      # DuckDB's optional feature requires a system libduckdb at link time.
      # Keep all-features compilation above, and execute tests for the
      # remaining feature combinations that are self-contained on runners.
      - run: cargo test --locked --all-targets --features rust4pm,parquet,dataframes
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.13"}
      - run: python -m pip install jsonschema
      - run: python scripts/reference_pipeline.py
      - name: Record deterministic fixture hashes
        run: find examples/generated -type f -name '*.json' ! -name 'reference-benchmark.json' -print0 | sort -z | xargs -0 sha256sum > /tmp/fixtures.first
      - run: python scripts/reference_pipeline.py
      - name: Verify deterministic fixture regeneration
        run: |
          find examples/generated -type f -name '*.json' ! -name 'reference-benchmark.json' -print0 | sort -z | xargs -0 sha256sum > /tmp/fixtures.second
          diff -u /tmp/fixtures.first /tmp/fixtures.second
      - run: python scripts/validate_workpack.py
      - run: python scripts/validate_jurisdiction_intake.py examples/input/jurisdiction-intake.synthetic.json
      - run: python scripts/test_validate_jurisdiction_intake.py
      - run: python scripts/test_reference_semantics.py
      - run: python scripts/test_synthetic_scenarios.py
      - run: python scripts/test_hf_space_projection.py
      - run: python scripts/test_verify_hf_publication.py
      - run: python scripts/test_scale_suite.py
      - run: python scripts/build_hf_dataset.py --output /tmp/foi-process-event-logs
      - run: python -m json.tool /tmp/foi-process-event-logs/manifest.json >/dev/null
      - run: python scripts/build_hf_space_data.py --bundle /tmp/foi-process-event-logs --output /tmp/dashboard-data.json
      - run: python -m json.tool /tmp/dashboard-data.json >/dev/null
      - run: python scripts/validate_scale_report.py benchmarks/rust-scale-windows-gnu.json --require-standard
      - name: Build and verify release evidence package
        run: |
          python scripts/build_release_evidence.py \
            --benchmark benchmarks/rust-scale-windows-gnu.json \
            --output /tmp/foi-process-release-evidence
          python scripts/verify_release_evidence.py /tmp/foi-process-release-evidence

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: space/package-lock.json
      - working-directory: space
        run: npm ci
      - working-directory: space
        run: npm run build
      - run: python3 scripts/check_hf_space_budget.py --dist space/dist --dashboard-data space/public/data/dashboard-data.json

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
