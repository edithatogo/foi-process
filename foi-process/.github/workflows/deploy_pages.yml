name: deploy-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "space/**"
      - "scripts/build_hf_dataset.py"
      - "scripts/build_hf_space_data.py"
      - "scripts/check_hf_space_budget.py"
      - ".github/workflows/deploy_pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: space/package-lock.json
      - name: Build verified dashboard projection
        run: |
          python scripts/build_hf_dataset.py --output /tmp/foi-process-event-logs
          python scripts/build_hf_space_data.py \
            --bundle /tmp/foi-process-event-logs \
            --output space/public/data/dashboard-data.json
      - name: Build dashboard
        working-directory: space
        run: |
          npm ci
          npm run build
      - name: Enforce dashboard budget
        run: python scripts/check_hf_space_budget.py --dist space/dist --dashboard-data space/public/data/dashboard-data.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: space/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
